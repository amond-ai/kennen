name: Release Please

on:
  push:
    branches: [main]

# The App token carries the write permissions — GITHUB_TOKEN needs none.
permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    steps:
      # Releases created with GITHUB_TOKEN do not trigger other workflows, so the
      # release App token is what lets the published Release start publish.yml.
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_GITHUB_APP_PRIVATE_KEY }}
          # Narrow the token to what release-please needs — without these the
          # token inherits every permission the App holds on the installation.
          # Issues write covers the labels release-please puts on its release PR.
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
