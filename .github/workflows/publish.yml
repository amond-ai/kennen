name: Publish to npm

on:
  release:
    types: [published]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup mise
        # Release builds never restore a tool cache, so a poisoned cache entry
        # from another workflow cannot reach the published artifact. npm
        # authenticates through OIDC trusted publishing (`id-token: write`),
        # which needs no registry-url or NODE_AUTH_TOKEN; the target registry
        # comes from package.json#publishConfig.registry.
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: false

      - name: Verify version matches release tag
        id: version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag ($TAG_VERSION)"
            exit 1
          fi
          echo "value=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether version is already published
        id: registry
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          # Ask for the exact version: dist-tags only point at the newest
          # releases, so an older re-run would read as unpublished.
          if [ "$(npm view "@amond-ai/kennen@${PACKAGE_VERSION}" version 2>/dev/null)" = "$PACKAGE_VERSION" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.registry.outputs.published != 'true'
        env:
          # Skip husky Git hook installation on CI runners.
          HUSKY: "0"
        run: bun install --frozen-lockfile

      - name: Build
        if: steps.registry.outputs.published != 'true'
        run: bun run build

      - name: Publish
        if: steps.registry.outputs.published != 'true'
        run: npm publish --provenance --access public
