version: 1
runner: skill-agent
name: skillret-readonly-agent
description: >
  SkillRet tasks measured as read-only seeded-vault Kennen use. The agent gets
  normal Kennen read instructions and read-only search/expand tools; writes are
  blocked and counted as failures.
skillRetrievalSuite: ../skill-retrieval/skillret-notion-ai.yaml
queries:
  seed: skillret-readonly-agent-v1
  limit: 200
conditions:
  - no-kennen
  - tool-driven-kennen
  - oracle-context
requiredConditions:
  - tool-driven-kennen
agent:
  kind: codex
  timeoutMs: 600000
scoring:
  k: [1, 5, 10]
  requireKennenUse: true
  requireExpandedEvidence: true
